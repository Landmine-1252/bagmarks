name: Build and release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: bagmarks-release-${{ github.event.release.id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out the published release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1

      - name: Validate version and prepare release notes
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$RELEASE_TAG"
          python3 tools/release.py \
            --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" \
            --notes-file dist/release-notes.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Run tests and build the installable ZIP
        run: make package LUA=lua5.1 LUAC=luac5.1

      - name: Save the validated package and release notes
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BagMarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/BagMarks-${{ steps.release.outputs.version }}.zip
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          archive: true

  publish:
    name: Attach ZIP to the published GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tested release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this build's validated files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
          digest-mismatch: error

      - name: Verify and attach the addon ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.version }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          python3 tools/publish_release.py --repository "$GITHUB_REPOSITORY" \
            --published-release-id "$RELEASE_ID" --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" \
            --archive "dist/BagMarks-$RELEASE_TAG.zip" --notes-file dist/release-notes.md

  curseforge:
    name: Upload published release to CurseForge
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check earlier attempts of this publication
        if: github.run_attempt > 1
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" |
            jq -r '"uploaded=\(any(.[].jobs[].steps[]?; .name == "Upload addon ZIP" and .conclusion == "success"))"' >> "$GITHUB_OUTPUT"

      - name: Download the validated addon and release notes
        if: steps.previous.outputs.uploaded != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
          digest-mismatch: error

      - name: Upload addon ZIP
        if: steps.previous.outputs.uploaded != 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TYPE: ${{ github.event.release.prerelease && 'beta' || 'release' }}
        run: |
          : "${CURSEFORGE_TOKEN:?Set the CURSEFORGE_TOKEN repository secret}"
          jq -n --arg version "$VERSION" --arg type "$RELEASE_TYPE" --rawfile notes dist/release-notes.md \
            '{displayName: $version, releaseType: $type, gameVersionNames: ["1.60.1"], changelogType: "markdown", changelog: $notes}' \
            > "$RUNNER_TEMP/curseforge-metadata.json"
          curl --fail --silent --show-error \
            --header "X-Api-Token: $CURSEFORGE_TOKEN" \
            --form "metadata=<$RUNNER_TEMP/curseforge-metadata.json" \
            --form "file=@dist/BagMarks-$VERSION.zip" \
            'https://wow.curseforge.com/api/projects/1806693/upload-file' |
            jq -er 'select(.id | type == "number" and . > 0) | "Uploaded CurseForge file \(.id)"'
